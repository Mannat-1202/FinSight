spring.application.name=finsight-backend
server.port=8080

# MySQL DataSource (env vars override for Docker; defaults for local dev)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/finsight_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# JWT
jwt.secret=${JWT_SECRET:FinSightSuperSecretKeyForJWTTokenGeneration2024MustBeLongEnough256bits!!}
jwt.expiration=${JWT_EXPIRATION:86400000}

# ML Service (env var overrides for Docker)
ml.service.url=${ML_SERVICE_URL:http://localhost:8000}
ml.service.timeout=5000

# CORS
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000}

# Multipart (CSV import)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Logging
logging.level.com.finsight=INFO
logging.level.org.springframework.security=WARN

